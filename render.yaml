# Review current compute/disk pricing before creating resources.
# Native Python runtime intentionally avoids Docker UID/mounted-disk mismatches.
services:
  - type: web
    name: setu-fastapi
    runtime: python
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    initialDeployHook: python -m tools.seed --file sample_events.json --expect-conflicts 0
    healthCheckPath: /health
    disk:
      name: payments-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_PATH
        value: /var/data/payments.db
      - key: API_KEY
        generateValue: true
      - key: REQUIRE_API_KEY
        value: "true"
      - key: SETTLEMENT_GRACE_HOURS
        value: "24"
